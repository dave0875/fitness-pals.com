name: PR Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  governance:
    name: PR Governance
    runs-on: [self-hosted, dev]
    env:
      PR_GOVERNANCE_TOKEN: ${{ secrets.PR_GOVERNANCE_TOKEN }}
    steps:
      - name: Ensure PR_GOVERNANCE_TOKEN is configured
        if: env.PR_GOVERNANCE_TOKEN == ''
        run: |
          echo "Missing required Actions secret PR_GOVERNANCE_TOKEN." >&2
          echo "Create a PAT with repo + project access and save it as the PR_GOVERNANCE_TOKEN Actions secret." >&2
          exit 1

      - name: Add Athlete Orbit Phase 4 issue to the existing product Project
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PR_GOVERNANCE_TOKEN }}
          script: |
            const targetIssueNumber = 262;
            const referenceIssueNumber = 260;
            const query = `
              query($owner: String!, $repo: String!, $target: Int!, $reference: Int!) {
                repository(owner: $owner, name: $repo) {
                  target: issue(number: $target) { id projectItems(first: 1) { totalCount } }
                  reference: issue(number: $reference) {
                    projectItems(first: 1) { nodes { project { id title } } }
                  }
                }
              }
            `;
            const data = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              target: targetIssueNumber,
              reference: referenceIssueNumber
            });
            if (data.repository.target.projectItems.totalCount > 0) {
              core.notice(`Issue #${targetIssueNumber} is already in a Project.`);
            } else {
              const project = data.repository.reference.projectItems.nodes[0]?.project;
              if (!project?.id) {
                core.setFailed(`Reference issue #${referenceIssueNumber} is not in a Project.`);
                return;
              }
              const mutation = `
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item { id }
                  }
                }
              `;
              await github.graphql(mutation, {
                projectId: project.id,
                contentId: data.repository.target.id
              });
              core.notice(`Added issue #${targetIssueNumber} to Project "${project.title}".`);
            }

      - name: Validate PR links an Issue in a Project
        uses: actions/github-script@v8
        env:
          DEPENDABOT_TRACKING_ISSUE: ${{ vars.DEPENDABOT_TRACKING_ISSUE }}
        with:
          github-token: ${{ secrets.PR_GOVERNANCE_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";

            const isDependabot =
              pr.user?.login === "dependabot[bot]" ||
              pr.user?.type === "Bot" && (pr.user?.login || "").includes("dependabot");

            const dependabotTrackingIssue = process.env.DEPENDABOT_TRACKING_ISSUE
              ? Number(process.env.DEPENDABOT_TRACKING_ISSUE)
              : null;

            const issueLineRegex = /(?:^|\n)\s*(?:-\s*)?Issue:\s*(?:#(\d+)|https:\/\/github\.com\/[^\/]+\/[^\/]+\/issues\/(\d+))\s*(?:\n|$)/i;
            const match = body.match(issueLineRegex);

            async function updatePrBodyWithIssue(issueNumber) {
              const line = `Issue: #${issueNumber}`;
              const nextBody = body.includes("## Issue")
                ? body.replace(/(^|\n)\s*Issue:\s*.*(\n|$)/i, `$1${line}$2`)
                : `## Issue\n- ${line}\n\n${body}`.trim();

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                body: nextBody
              });
              return nextBody;
            }

            let issueNumber = null;
            let effectiveBody = body;

            if (match) {
              issueNumber = Number(match[1] || match[2]);
            }

            if (isDependabot) {
              if (!dependabotTrackingIssue) {
                core.setFailed(
                  "Missing repository variable DEPENDABOT_TRACKING_ISSUE; set it to the rolling Dependabot issue number."
                );
                return;
              }

              if (issueNumber !== dependabotTrackingIssue) {
                effectiveBody = await updatePrBodyWithIssue(dependabotTrackingIssue);
                issueNumber = dependabotTrackingIssue;
              }
            } else {
              if (!issueNumber) {
                core.setFailed(
                  "PR body must include a single Issue reference line: `Issue: #<number>` (and the Issue must be in a Project)."
                );
                return;
              }
            }

            if (!issueNumber || Number.isNaN(issueNumber)) {
              core.setFailed("Unable to parse Issue number from PR body.");
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            if (issue.pull_request) {
              core.setFailed(`Issue: #${issueNumber} is a pull request, not an issue.`);
              return;
            }

            if (issue.state !== "open") {
              core.setFailed(`Issue: #${issueNumber} must be OPEN (current: ${issue.state}).`);
              return;
            }

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) {
                    projectItems(first: 1) {
                      totalCount
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: issueNumber
            });

            const totalCount = result?.repository?.issue?.projectItems?.totalCount ?? 0;
            if (totalCount < 1) {
              core.setFailed(
                `Issue: #${issueNumber} must belong to at least one GitHub Project (Project items: ${totalCount}).`
              );
              return;
            }

            core.notice(`PR links Issue #${issueNumber} and it is in a Project.`);
