name: Phase 1 Project Membership

on:
  push:
    branches:
      - feat/product-experience-v2-shell

permissions:
  contents: read
  issues: read

jobs:
  add-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue 235 to Product Project
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PR_GOVERNANCE_TOKEN }}
          script: |
            const sourceNumber = 220;
            const targetNumber = 235;
            const query = `
              query($owner: String!, $repo: String!, $source: Int!, $target: Int!) {
                repository(owner: $owner, name: $repo) {
                  source: issue(number: $source) {
                    projectItems(first: 10) { nodes { project { id title } } }
                  }
                  target: issue(number: $target) {
                    id
                    projectItems(first: 10) { nodes { project { id title } } }
                  }
                }
              }`;
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              source: sourceNumber,
              target: targetNumber,
            });
            const existing = result.repository.target.projectItems.nodes;
            if (existing.length > 0) {
              core.notice(`Issue #${targetNumber} already belongs to project: ${existing[0].project.title}`);
              return;
            }
            const sourceProjects = result.repository.source.projectItems.nodes;
            if (sourceProjects.length === 0) {
              core.setFailed(`Reference issue #${sourceNumber} is not in a project.`);
              return;
            }
            const project = sourceProjects[0].project;
            await github.graphql(
              `mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }`,
              { projectId: project.id, contentId: result.repository.target.id }
            );
            core.notice(`Added issue #${targetNumber} to project: ${project.title}`);
