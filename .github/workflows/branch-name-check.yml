name: Branch name check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce branch naming pattern
        run: |
          BRANCH="${{ github.head_ref }}"
          if ! [[ "$BRANCH" =~ ^(feature|hotfix)/[0-9]+-[a-z0-9-]+$ ]]; then
            echo "Branch '$BRANCH' must match ^(feature|hotfix)/[0-9]+-[a-z0-9-]+$"
            exit 1
          fi
