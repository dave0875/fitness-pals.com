name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/training_agent/requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest -vv --maxfail=1 --disable-warnings \
            --cov=services/training_agent --cov-report=term-missing \
            services/training_agent/tests
