name: Tag validation

on:
  push:
    tags:
      - '*'

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag name and message
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SEMVER_RE='^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$'
          DATE_RE='^v[0-9]{8}-[a-z0-9-]+$'

          if ! [[ "$TAG" =~ $SEMVER_RE || "$TAG" =~ $DATE_RE ]]; then
            echo "Tag '$TAG' must match either:"
            echo "  - SemVer: $SEMVER_RE"
            echo "  - Date:   $DATE_RE"
            exit 1
          fi

          first_line="$(git tag -l --format='%(contents)' "$TAG" | head -n1 | tr -d '\r')"
          if [[ -z "${first_line// }" ]]; then
            echo "Tag '$TAG' must be annotated with a non-empty message describing what shipped."
            exit 1
          fi
