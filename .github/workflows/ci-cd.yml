name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_dev:
        description: Deploy this revision to the dev environment after tests pass
        required: false
        default: false
        type: boolean
      preflight_prod_containers:
        description: Non-mutating validation of prod containers and backup destination
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lint & Test
    runs-on:
      - self-hosted
      - ${{ github.event_name == 'pull_request' && 'dev' || 'prod' }}
    env:
      RUNTRAINER_JWT_SECRET: ci-secret
      RUNTRAINER_GOOGLE_CLIENT_ID: ci-google-id
      RUNTRAINER_GOOGLE_CLIENT_SECRET: ci-google-secret
      RUNTRAINER_GOOGLE_REDIRECT_URI: https://example.com/oauth/callback
      RUNTRAINER_MICROSOFT_CLIENT_ID: ci-ms-id
      RUNTRAINER_MICROSOFT_CLIENT_SECRET: ci-ms-secret
      RUNTRAINER_MICROSOFT_REDIRECT_URI: https://example.com/auth/microsoft/callback
      RUNTRAINER_APPLE_CLIENT_ID: ci-apple-id
      RUNTRAINER_APPLE_CLIENT_SECRET: ci-apple-secret
      RUNTRAINER_APPLE_REDIRECT_URI: https://example.com/auth/apple/callback
      RUNTRAINER_DATABASE_URL: sqlite:///./ci.db
      RUNTRAINER_FERNET_KEY: 1TvhF4GaxnOIBIq74rU9VrAXaxoBZw-oTCT3vJWRTwc=
      GRAFANA_OIDC_CLIENT_ID: ci-grafana-client
      GRAFANA_OIDC_CLIENT_SECRET: ci-grafana-secret
      DOCKER_BUILDKIT: 1
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            services/training_agent/requirements.txt
            services/training_agent/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies (backend + training agent)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r services/training_agent/requirements-dev.txt
          python -m pip install ruff mypy

      - name: Run checks and collect logs
        id: run_checks
        env:
          CI_IMAGE_TAG: fitness-pals-training-agent:ci-${{ github.sha }}
          PYTHONPATH: backend:services/training_agent:.
        run: |
          set +e
          set -uo pipefail

          pr_number=""

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            pr_number="${GITHUB_EVENT_PATH:+$(jq -r '.pull_request.number // empty' "$GITHUB_EVENT_PATH")}"
          fi

          artifact_name="ci-logs-run-${GITHUB_RUN_ID}"
          if [[ -n "$pr_number" ]]; then
            artifact_name="ci-logs-pr-${pr_number}-run-${GITHUB_RUN_ID}"
          fi

          mkdir -p ci-logs

          overall_status="passed"
          backend_test_status="not_run"
          backend_lint_status="not_run"
          backend_typecheck_status="not_run"
          frontend_build_status="not_run"
          frontend_test_status="not_run"
          frontend_lint_status="not_run"
          frontend_root="frontend"
          frontend_metadata_status="passed"
          compose_config_status="not_run"
          for manifest in package.json package-lock.json; do
            if [ ! -f "$frontend_root/$manifest" ]; then
              echo "::error title=Missing frontend manifest::Expected $frontend_root/$manifest; the frontend is not buildable."
              frontend_metadata_status="failed"
              overall_status="failed"
            fi
          done
          docker_build_status="not_run"

          run_cmd() {
            local label="$1"
            local status_var="$2"
            local logfile="$3"
            shift 3

            echo "=== ${label} ==="
            "$@" >"$logfile" 2>&1
            local rc=$?
            cat "$logfile"
            if [[ $rc -eq 0 ]]; then
              eval "${status_var}='passed'"
            else
              eval "${status_var}='failed'"
              overall_status="failed"
              echo "::error title=${label}::${label} failed. See ${logfile} in the CI artifact."
            fi
          }

          declare -A image_build_pids
          declare -A image_build_labels
          declare -A image_build_logs

          start_image_build() {
            local key="$1"
            local label="$2"
            local tag="$3"
            local logfile="$4"
            shift 4

            (
              docker build --pull -t "$tag" "$@" >"$logfile" 2>&1
              rc=$?
              docker rmi "$tag" >/dev/null 2>&1 || true
              exit "$rc"
            ) &
            image_build_pids["$key"]=$!
            image_build_labels["$key"]="$label"
            image_build_logs["$key"]="$logfile"
          }

          wait_for_image_build() {
            local key="$1"
            local status_var="$2"
            local label="${image_build_labels[$key]}"
            local logfile="${image_build_logs[$key]}"
            local status="passed"

            echo "=== ${label} ==="
            if ! wait "${image_build_pids[$key]}"; then
              status="failed"
              overall_status="failed"
              echo "::error title=${label}::${label} failed. See ${logfile} in the CI artifact."
            fi
            cat "$logfile"
            printf -v "$status_var" '%s' "$status"
          }

          echo "=== Start deployable image builds in parallel ==="
          start_image_build frontend "Frontend image build" \
            "fitness-pals-frontend:ci-${GITHUB_SHA}" \
            "ci-logs/docker-build-frontend.log" -f frontend/Dockerfile frontend
          start_image_build backend "Backend/worker image build" \
            "fitness-pals-backend:ci-${GITHUB_SHA}" \
            "ci-logs/docker-build-backend.log" -f backend/Dockerfile backend
          start_image_build training_agent "Training-agent image build" \
            "$CI_IMAGE_TAG" "ci-logs/docker-build-training-agent.log" -f services/training_agent/Dockerfile .

          echo "=== Validate deployment Compose configurations ==="
          run_cmd "Deployment Compose configurations" compose_config_status \
            "ci-logs/compose-config.log" bash -c \
            'docker compose --env-file .env.production config -q && COMPOSE_FILE=compose.yml:compose.dev.yml docker compose --env-file .env.production config -q'

          run_cmd "Backend lint" backend_lint_status "ci-logs/backend-lint.log" \
            bash -c "python -m compileall backend services/training_agent && ruff check --select=E9,F63,F7,F82 --target-version=py310 backend services/training_agent"

          echo "=== Backend typecheck + migrations (offline) ==="
          bash -c "mypy --ignore-missing-imports --implicit-optional backend services/training_agent && cd backend && alembic upgrade head --sql >/dev/null" >"ci-logs/backend-typecheck.log" 2>&1
          rc=$?
          cat "ci-logs/backend-typecheck.log"
          if [[ $rc -eq 0 ]]; then
            backend_typecheck_status="passed"
          else
            backend_typecheck_status="failed"
            overall_status="failed"
            echo "::error title=Backend typecheck::Backend typecheck/migrations failed. See ci-logs/backend-typecheck.log in the CI artifact."
          fi

          echo "=== Backend tests ==="
          bash -c "pytest -vv --maxfail=1 --disable-warnings --cov=backend --cov=services/training_agent --cov-report=term-missing backend/tests services/training_agent/tests" >"ci-logs/backend-test.log" 2>&1
          rc=$?
          cat "ci-logs/backend-test.log"
          if [[ $rc -eq 0 ]]; then
            backend_test_status="passed"
          else
            backend_test_status="failed"
            overall_status="failed"
            echo "::error title=Backend tests::Backend tests failed. See ci-logs/backend-test.log in the CI artifact."
          fi

          if [ "$frontend_metadata_status" = "passed" ]; then
            echo "=== Frontend install (${frontend_root}) ==="
            (cd "$frontend_root" && npm ci) >"ci-logs/frontend-install.log" 2>&1
            rc=$?
            cat "ci-logs/frontend-install.log"
            if [[ $rc -ne 0 ]]; then
              frontend_lint_status="failed"
              frontend_test_status="failed"
              frontend_build_status="failed"
              overall_status="failed"
              echo "::error title=Frontend install::npm ci failed. See ci-logs/frontend-install.log in the CI artifact."
            else
              run_cmd "Frontend lint" frontend_lint_status "ci-logs/frontend-lint.log" bash -c "cd \"$frontend_root\" && npm run lint --if-present"
              run_cmd "Frontend tests" frontend_test_status "ci-logs/frontend-test.log" bash -c "cd \"$frontend_root\" && npm test --if-present -- --watch=false"
            fi
          else
            frontend_lint_status="failed"
            frontend_test_status="failed"
          fi

          echo "=== Collect deployable image build results ==="
          docker_build_status="passed"
          frontend_image_status="not_run"
          backend_image_status="not_run"
          training_agent_image_status="not_run"
          wait_for_image_build frontend frontend_image_status
          wait_for_image_build backend backend_image_status
          wait_for_image_build training_agent training_agent_image_status
          frontend_build_status="$frontend_image_status"
          cp ci-logs/docker-build-frontend.log ci-logs/frontend-build.log
          for image_status in \
            "$frontend_image_status" \
            "$backend_image_status" \
            "$training_agent_image_status"; do
            if [ "$image_status" != "passed" ]; then
              docker_build_status="failed"
            fi
          done

          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          echo "=== Check summary ==="
          echo "backend_lint: ${backend_lint_status}"
          echo "backend_typecheck: ${backend_typecheck_status}"
          echo "docker_build: ${docker_build_status}"
          echo "compose_config: ${compose_config_status}"
          echo "backend_tests: ${backend_test_status}"
          echo "frontend_build: ${frontend_build_status}"
          echo "frontend_tests: ${frontend_test_status}"
          echo "frontend_lint: ${frontend_lint_status}"
          echo "overall: ${overall_status}"

          # Do not exit non-zero here; downstream step will fail if overall_status != passed

          cat >ci-logs/summary.json <<EOF
          {
            "pr": ${pr_number:-null},
            "run_id": ${GITHUB_RUN_ID},
            "status": "${overall_status}",
            "checks": {
              "backend_tests": "${backend_test_status}",
              "backend_lint": "${backend_lint_status}",
              "backend_typecheck": "${backend_typecheck_status}",
              "frontend_build": "${frontend_build_status}",
              "frontend_tests": "${frontend_test_status}",
              "frontend_lint": "${frontend_lint_status}",
              "docker_build": "${docker_build_status}",
              "compose_config": "${compose_config_status}"
            },
            "timestamp": "${timestamp}"
          }
          EOF

          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"
          echo "overall_status=${overall_status}" >> "$GITHUB_OUTPUT"
          echo "backend_test_status=${backend_test_status}" >> "$GITHUB_OUTPUT"
          echo "backend_lint_status=${backend_lint_status}" >> "$GITHUB_OUTPUT"
          echo "backend_typecheck_status=${backend_typecheck_status}" >> "$GITHUB_OUTPUT"
          echo "frontend_build_status=${frontend_build_status}" >> "$GITHUB_OUTPUT"
          echo "frontend_test_status=${frontend_test_status}" >> "$GITHUB_OUTPUT"
          echo "frontend_lint_status=${frontend_lint_status}" >> "$GITHUB_OUTPUT"
          echo "docker_build_status=${docker_build_status}" >> "$GITHUB_OUTPUT"
          echo "compose_config_status=${compose_config_status}" >> "$GITHUB_OUTPUT"

      - name: Upload CI logs artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.run_checks.outputs.artifact_name }}
          path: ci-logs
          retention-days: 30

      - name: Post CI summary to PR
        if: always() && steps.run_checks.outputs.pr_number != ''
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ steps.run_checks.outputs.pr_number }}
          ARTIFACT_NAME: ${{ steps.run_checks.outputs.artifact_name }}
          RUN_STATUS: ${{ steps.run_checks.outputs.overall_status }}
          BACKEND_TEST_STATUS: ${{ steps.run_checks.outputs.backend_test_status }}
          BACKEND_LINT_STATUS: ${{ steps.run_checks.outputs.backend_lint_status }}
          BACKEND_TYPECHECK_STATUS: ${{ steps.run_checks.outputs.backend_typecheck_status }}
          FRONTEND_BUILD_STATUS: ${{ steps.run_checks.outputs.frontend_build_status }}
          FRONTEND_TEST_STATUS: ${{ steps.run_checks.outputs.frontend_test_status }}
          FRONTEND_LINT_STATUS: ${{ steps.run_checks.outputs.frontend_lint_status }}
          DOCKER_BUILD_STATUS: ${{ steps.run_checks.outputs.docker_build_status }}
          COMPOSE_CONFIG_STATUS: ${{ steps.run_checks.outputs.compose_config_status }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = process.env.PR_NUMBER && process.env.PR_NUMBER !== "" ? Number(process.env.PR_NUMBER) : null;
            if (!prNumber) {
              core.setFailed('PR number is required to post CI summary.');
            }

            const prUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${prNumber}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactName = process.env.ARTIFACT_NAME || `ci-logs-pr-${prNumber}-run-${context.runId}`;

            const statusMap = {
              passed: 'PASS',
              failed: 'FAIL',
              not_run: 'N/A'
            };

            const checks = {
              'Backend Tests': process.env.BACKEND_TEST_STATUS,
              'Backend Lint': process.env.BACKEND_LINT_STATUS,
              'Backend Typecheck': process.env.BACKEND_TYPECHECK_STATUS,
              'Frontend Build': process.env.FRONTEND_BUILD_STATUS,
              'Frontend Tests': process.env.FRONTEND_TEST_STATUS,
              'Frontend Lint': process.env.FRONTEND_LINT_STATUS,
              'Docker Build': process.env.DOCKER_BUILD_STATUS,
              'Compose Config': process.env.COMPOSE_CONFIG_STATUS
            };

            const checksLines = Object.entries(checks)
              .map(([name, value]) => `- ${name}: ${statusMap[value] || 'N/A'}`)
              .join('\n');

            const body = [
              '### CI Run Summary',
              `**PR:** ${prUrl}  `,
              `**Run:** ${runUrl}  `,
              `**Status:** ${process.env.RUN_STATUS.toUpperCase()}  `,
              `**Timestamp:** ${new Date().toISOString()}`,
              '',
              '### Checks',
              checksLines,
              '',
              '### Artifact',
              'Logs and details are available in the CI artifact:',
              `**${artifactName}**`,
              '',
              '(Do not paste logs directly into the PR; always refer to artifacts)'
            ].join('\\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });

      - name: Fail if checks failed
        if: always() && steps.run_checks.outputs.overall_status != 'passed'
        run: exit 1

      - name: Preflight production container and backup destination
        if: github.event_name == 'workflow_dispatch' && inputs.preflight_prod_containers
        run: |
          python3 scripts/reconcile_compose_container_names.py \
            --dry-run \
            --project fitness-palscom \
            --backup-dir /home/ghrunner/fitness-pals-backups/pre-compose-migration \
            --legacy-project fitness-pals-deploy \
            --legacy-project garmin-grafana \
            --legacy-project garmin_grafana \
            runtrainer-postgres influxdb grafana

  deploy-dev:
    name: Deploy to Dev
    needs: test
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy_dev)
    runs-on: [self-hosted, dev]
    env:
      COMPOSE_FILE: compose.yml:compose.dev.yml
      ENV_FILE: .env
      SECRET_ENV_PATH: /home/dbarker/fitness-pals.com-secrets/.env
      OVERLAY_ENV_PATH: /home/dbarker/fitness-pals.com-secrets/.env.authentik-oidc
      COMPOSE_PROJECT_NAME: fitness-palscom
      RUNTRAINER_POSTGRES_VOLUME_NAME: fitness-palscom_postgres_data
      RUNTRAINER_RELEASE_SHA: ${{ github.sha }}
      GRAFANA_OIDC_CLIENT_ID: ${{ secrets.DEV_GRAFANA_OIDC_CLIENT_ID }}
      GRAFANA_OIDC_CLIENT_SECRET: ${{ secrets.DEV_GRAFANA_OIDC_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Grafana OIDC deployment secrets
        run: |
          if [ -z "$GRAFANA_OIDC_CLIENT_ID" ]; then
            echo "Missing required dev secret: DEV_GRAFANA_OIDC_CLIENT_ID" >&2
            exit 1
          fi
          if [ -z "$GRAFANA_OIDC_CLIENT_SECRET" ]; then
            echo "Missing required dev secret: DEV_GRAFANA_OIDC_CLIENT_SECRET" >&2
            exit 1
          fi

      - name: Assemble env from base and overlay
        run: |
          if [ ! -f "$SECRET_ENV_PATH" ]; then
            echo "Expected env at $SECRET_ENV_PATH; not found." >&2
            exit 1
          fi
          inputs=("$SECRET_ENV_PATH")
          if [ -f "$OVERLAY_ENV_PATH" ]; then
            inputs+=("$OVERLAY_ENV_PATH")
          fi
          python3 scripts/merge_env.py --output "$ENV_FILE" "${inputs[@]}"

      - name: Show environment target
        run: echo "Deploying to DEV via self-hosted runner $(hostname)"

      - name: Detect changed services
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "postgres_changed=true"
              echo "influxdb_changed=true"
              echo "grafana_changed=true"
              echo "cloudflared_changed=true"
              echo "frontend_changed=true"
              echo "backend_changed=true"
              echo "worker_changed=true"
              echo "training_agent_changed=true"
            } >> "$GITHUB_OUTPUT"
            echo "Manual deployment scope: complete dev runtime."
            exit 0
          fi
          python3 scripts/detect_changed_services.py \
            --before "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --output "$GITHUB_OUTPUT"

      - name: Validate compose config
        run: docker compose --env-file "$ENV_FILE" config -q

      - name: Ensure external volumes exist
        run: |
          docker volume inspect "$RUNTRAINER_POSTGRES_VOLUME_NAME" >/dev/null 2>&1 || docker volume create "$RUNTRAINER_POSTGRES_VOLUME_NAME"
          docker volume inspect garmin-grafana_influxdb_data >/dev/null 2>&1 || docker volume create garmin-grafana_influxdb_data
          docker volume inspect garmin-grafana_grafana_data >/dev/null 2>&1 || docker volume create garmin-grafana_grafana_data

      - name: Pull changed base images
        if: steps.changes.outputs.postgres_changed == 'true' || steps.changes.outputs.influxdb_changed == 'true' || steps.changes.outputs.grafana_changed == 'true' || steps.changes.outputs.cloudflared_changed == 'true'
        run: |
          services=()
          if [ "${{ steps.changes.outputs.postgres_changed }}" = "true" ]; then
            services+=(runtrainer-postgres)
          fi
          if [ "${{ steps.changes.outputs.influxdb_changed }}" = "true" ]; then
            services+=(influxdb)
          fi
          if [ "${{ steps.changes.outputs.grafana_changed }}" = "true" ]; then
            services+=(grafana)
          fi
          if [ "${{ steps.changes.outputs.cloudflared_changed }}" = "true" ]; then
            services+=(cloudflared)
          fi
          docker compose --env-file "$ENV_FILE" pull "${services[@]}"

      - name: Build changed app services
        if: steps.changes.outputs.frontend_changed == 'true' || steps.changes.outputs.backend_changed == 'true' || steps.changes.outputs.worker_changed == 'true' || steps.changes.outputs.training_agent_changed == 'true'
        run: |
          services=()
          if [ "${{ steps.changes.outputs.frontend_changed }}" = "true" ]; then
            services+=(frontend)
          fi
          if [ "${{ steps.changes.outputs.backend_changed }}" = "true" ]; then
            services+=(backend)
            services+=(worker)
          fi
          if [ "${{ steps.changes.outputs.worker_changed }}" = "true" ] && [ "${{ steps.changes.outputs.backend_changed }}" != "true" ]; then
            services+=(worker)
          fi
          if [ "${{ steps.changes.outputs.training_agent_changed }}" = "true" ]; then
            services+=(training-agent)
          fi
          docker compose --env-file "$ENV_FILE" build "${services[@]}"

      - name: Restart changed app services
        if: steps.changes.outputs.frontend_changed == 'true' || steps.changes.outputs.backend_changed == 'true' || steps.changes.outputs.worker_changed == 'true' || steps.changes.outputs.training_agent_changed == 'true'
        run: |
          services=()
          if [ "${{ steps.changes.outputs.frontend_changed }}" = "true" ]; then
            services+=(frontend)
          fi
          if [ "${{ steps.changes.outputs.backend_changed }}" = "true" ]; then
            services+=(backend)
            services+=(worker)
          fi
          if [ "${{ steps.changes.outputs.worker_changed }}" = "true" ] && [ "${{ steps.changes.outputs.backend_changed }}" != "true" ]; then
            services+=(worker)
          fi
          if [ "${{ steps.changes.outputs.training_agent_changed }}" = "true" ]; then
            services+=(training-agent)
          fi
          recreate_args=()
          if [ "${{ steps.changes.outputs.frontend_changed }}" = "true" ]; then
            recreate_args+=(--force-recreate)
          fi
          docker compose --env-file "$ENV_FILE" up -d --no-deps "${recreate_args[@]}" "${services[@]}"

      - name: Skip deploy when no app services changed
        if: steps.changes.outputs.frontend_changed != 'true' && steps.changes.outputs.backend_changed != 'true' && steps.changes.outputs.worker_changed != 'true' && steps.changes.outputs.training_agent_changed != 'true'
        run: echo "No backend, worker, or training-agent changes detected; skipping DEV deploy."

      - name: Reconcile complete dev runtime
        if: steps.changes.outputs.postgres_changed == 'true' || steps.changes.outputs.influxdb_changed == 'true' || steps.changes.outputs.grafana_changed == 'true' || steps.changes.outputs.cloudflared_changed == 'true'
        run: |
          docker compose --env-file "$ENV_FILE" up -d --remove-orphans \
            runtrainer-postgres \
            influxdb \
            grafana \
            authentik-redis \
            authentik-server \
            authentik-worker \
            backend \
            worker \
            training-agent \
            frontend \
            cloudflared \
            cloudflared-loopback

      - name: Reconcile Authentik upstream Google SSO
        run: docker compose --env-file "$ENV_FILE" --profile bootstrap run --rm --no-deps authentik-bootstrap

      - name: Smoke check changed service readiness
        if: steps.changes.outputs.frontend_changed == 'true' || steps.changes.outputs.backend_changed == 'true' || steps.changes.outputs.worker_changed == 'true' || steps.changes.outputs.training_agent_changed == 'true'
        run: |
          urls=()
          if [ "${{ steps.changes.outputs.backend_changed }}" = "true" ] || [ "${{ steps.changes.outputs.worker_changed }}" = "true" ]; then
            BACKEND_HOST_PORT="$(python3 scripts/read_env_value.py "$ENV_FILE" RUNTRAINER_BACKEND_HOST_PORT --default 8000)"
            urls+=("http://127.0.0.1:${BACKEND_HOST_PORT}/ready")
          fi
          if [ "${{ steps.changes.outputs.training_agent_changed }}" = "true" ]; then
            TRAINING_AGENT_HOST_PORT="$(python3 scripts/read_env_value.py "$ENV_FILE" TRAINING_AGENT_HOST_PORT --default 9000)"
            urls+=("http://127.0.0.1:${TRAINING_AGENT_HOST_PORT}/ready")
          fi
          if [ "${{ steps.changes.outputs.backend_changed }}" = "true" ] || [ "${{ steps.changes.outputs.worker_changed }}" = "true" ]; then
            worker_cid="$(docker compose --env-file "$ENV_FILE" ps -q worker)"
            if [ -z "$worker_cid" ]; then
              echo "Worker container is not running." >&2
              exit 1
            fi
            worker_status="$(docker inspect -f '{{.State.Status}}' "$worker_cid")"
            if [ "$worker_status" != "running" ]; then
              echo "Worker container status is $worker_status, expected running." >&2
              exit 1
            fi
            worker_cmd="$(docker inspect -f '{{json .Config.Cmd}}' "$worker_cid")"
            echo "$worker_cmd" | grep -q 'app.workers.sync_jobs_worker' || {
              echo "Worker container command does not target the sync job worker." >&2
              exit 1
            }
          fi
          if [ "${{ steps.changes.outputs.frontend_changed }}" = "true" ]; then
            frontend_cid="$(docker compose --env-file "$ENV_FILE" ps -q frontend)"
            if [ -z "$frontend_cid" ]; then
              echo "Frontend container is not running." >&2
              exit 1
            fi
            frontend_health_deadline=$((SECONDS + 120))
            frontend_health="starting"
            while [ "$SECONDS" -lt "$frontend_health_deadline" ]; do
              frontend_health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$frontend_cid")"
              if [ "$frontend_health" = "healthy" ]; then
                break
              fi
              sleep 2
            done
            if [ "$frontend_health" != "healthy" ]; then
              echo "Frontend did not become healthy; last status was $frontend_health." >&2
              exit 1
            fi
            frontend_release="$(docker inspect -f '{{index .Config.Labels "com.fitness-pals.release-sha"}}' "$frontend_cid")"
            if [ "$frontend_release" != "$RUNTRAINER_RELEASE_SHA" ]; then
              echo "Frontend container is release $frontend_release, expected release $RUNTRAINER_RELEASE_SHA." >&2
              exit 1
            fi
          fi
          if [ ${#urls[@]} -gt 0 ]; then
            python3 scripts/smoke_urls.py \
              --urls "$(printf '%s\n' "${urls[@]}")" \
              --timeout 150 \
              --request-timeout 15
          fi

      - name: Smoke check external Cloudflare ingress
        if: steps.changes.outputs.cloudflared_changed == 'true' || steps.changes.outputs.frontend_changed == 'true' || steps.changes.outputs.backend_changed == 'true' || steps.changes.outputs.training_agent_changed == 'true' || steps.changes.outputs.grafana_changed == 'true'
        run: |
          CLOUDFLARE_SMOKE_URLS="$(python3 scripts/read_env_value.py "$ENV_FILE" CLOUDFLARE_SMOKE_URLS)"
          CLOUDFLARE_SMOKE_TIMEOUT_SECONDS="$(python3 scripts/read_env_value.py "$ENV_FILE" CLOUDFLARE_SMOKE_TIMEOUT_SECONDS --default 90)"
          if [ -z "${CLOUDFLARE_SMOKE_URLS}" ]; then
            echo "CLOUDFLARE_SMOKE_URLS must be set in $ENV_FILE to verify external ingress." >&2
            exit 1
          fi
          python3 scripts/smoke_urls.py \
            --urls "$CLOUDFLARE_SMOKE_URLS" \
            --timeout "$CLOUDFLARE_SMOKE_TIMEOUT_SECONDS"

  deploy-prod:
    name: Deploy to Prod
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, prod]
    environment:
      name: production
    env:
      COMPOSE_FILE: compose.yml
      ENV_FILE: .env
      SECRET_ENV_PATH: /home/fitness-pals/fitness-pals.com-secrets/.env
      OVERLAY_ENV_PATH: /home/fitness-pals/fitness-pals.com-secrets/.env.authentik-oidc
      COMPOSE_PROJECT_NAME: fitness-palscom
      RUNTRAINER_POSTGRES_VOLUME_NAME: fitness-pals-deploy_postgres_data
      RUNTRAINER_RELEASE_SHA: ${{ github.sha }}
      RUN_AS_USER: fitness-pals
      STATEFUL_BACKUP_DIR: /home/ghrunner/fitness-pals-backups/pre-compose-migration
      GRAFANA_OIDC_CLIENT_ID: ${{ secrets.GRAFANA_OIDC_CLIENT_ID }}
      GRAFANA_OIDC_CLIENT_SECRET: ${{ secrets.GRAFANA_OIDC_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Grafana OIDC deployment secrets
        run: |
          if [ -z "$GRAFANA_OIDC_CLIENT_ID" ]; then
            echo "Missing required production secret: GRAFANA_OIDC_CLIENT_ID" >&2
            exit 1
          fi
          if [ -z "$GRAFANA_OIDC_CLIENT_SECRET" ]; then
            echo "Missing required production secret: GRAFANA_OIDC_CLIENT_SECRET" >&2
            exit 1
          fi

      - name: Assemble env from base and overlay
        run: |
          if [ ! -f "$SECRET_ENV_PATH" ]; then
            echo "Expected env at $SECRET_ENV_PATH; not found." >&2
            exit 1
          fi
          inputs=("$SECRET_ENV_PATH")
          if [ -f "$OVERLAY_ENV_PATH" ]; then
            inputs+=("$OVERLAY_ENV_PATH")
          fi
          python3 scripts/merge_env.py --output "$ENV_FILE" "${inputs[@]}"

      - name: Show environment target
        run: echo "Deploying to PROD via self-hosted runner $(hostname)"

      - name: Detect changed services
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            {
              echo "postgres_changed=true"
              echo "influxdb_changed=true"
              echo "grafana_changed=true"
              echo "cloudflared_changed=true"
              echo "frontend_changed=true"
              echo "backend_changed=true"
              echo "worker_changed=true"
              echo "training_agent_changed=true"
            } >> "$GITHUB_OUTPUT"
            echo "Manual deployment scope: complete production runtime."
            exit 0
          fi
          python3 scripts/detect_changed_services.py \
            --before "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --output "$GITHUB_OUTPUT"

      - name: Ensure external volumes exist
        run: |
          docker volume inspect "$RUNTRAINER_POSTGRES_VOLUME_NAME" >/dev/null
          docker volume inspect garmin-grafana_influxdb_data >/dev/null 2>&1 || docker volume create garmin-grafana_influxdb_data
          docker volume inspect garmin-grafana_grafana_data >/dev/null 2>&1 || docker volume create garmin-grafana_grafana_data

      - name: Validate compose config
        run: docker compose --env-file "$ENV_FILE" config -q

      - name: Pull changed base images
        if: steps.changes.outputs.postgres_changed == 'true' || steps.changes.outputs.influxdb_changed == 'true' || steps.changes.outputs.grafana_changed == 'true' || steps.changes.outputs.cloudflared_changed == 'true'
        run: |
          services=()
          if [ "${{ steps.changes.outputs.postgres_changed }}" = "true" ]; then
            services+=(runtrainer-postgres)
          fi
          if [ "${{ steps.changes.outputs.influxdb_changed }}" = "true" ]; then
            services+=(influxdb)
          fi
          if [ "${{ steps.changes.outputs.grafana_changed }}" = "true" ]; then
            services+=(grafana)
          fi
          if [ "${{ steps.changes.outputs.cloudflared_changed }}" = "true" ]; then
            services+=(cloudflared)
          fi
          docker compose --env-file "$ENV_FILE" pull "${services[@]}"

      - name: Build production app images
        run: |
          docker compose --env-file "$ENV_FILE" build \
            frontend backend worker training-agent

      - name: Reconcile legacy stateful container names
        run: |
          python3 scripts/reconcile_compose_container_names.py \
            --project "$COMPOSE_PROJECT_NAME" \
            --backup-dir "$STATEFUL_BACKUP_DIR" \
            --legacy-project fitness-pals-deploy \
            --legacy-project garmin-grafana \
            --legacy-project garmin_grafana \
            runtrainer-postgres influxdb grafana

      - name: Reconcile complete production runtime
        run: |
          frontend_cids=()
          while IFS= read -r frontend_cid; do
            if [ -n "$frontend_cid" ]; then
              frontend_cids+=("$frontend_cid")
            fi
          done < <(
            docker ps -aq \
              --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" \
              --filter "label=com.docker.compose.service=frontend"
          )
          if [ ${#frontend_cids[@]} -gt 0 ]; then
            echo "Removing existing project frontend containers before replacement."
            docker rm -f "${frontend_cids[@]}"
          fi
          docker compose --env-file "$ENV_FILE" up -d --remove-orphans \
            runtrainer-postgres \
            influxdb \
            grafana \
            authentik-redis \
            authentik-server \
            authentik-worker \
            backend \
            worker \
            training-agent \
            frontend \
            cloudflared \
            cloudflared-loopback

      - name: Reconcile Authentik upstream Google SSO
        run: docker compose --env-file "$ENV_FILE" --profile bootstrap run --rm --no-deps authentik-bootstrap

      - name: Smoke check complete local production runtime
        run: |
          urls=(
            "http://authentik-server:9000/-/health/ready/"
            "http://backend:8000/ready"
            "http://training-agent:9000/ready"
            "http://grafana:3000/api/health"
          )
          worker_cid="$(docker compose --env-file "$ENV_FILE" ps -q worker)"
          if [ -z "$worker_cid" ]; then
            echo "Worker container is not running." >&2
            exit 1
          fi
          worker_status="$(docker inspect -f '{{.State.Status}}' "$worker_cid")"
          if [ "$worker_status" != "running" ]; then
            echo "Worker container status is $worker_status, expected running." >&2
            exit 1
          fi
          worker_cmd="$(docker inspect -f '{{json .Config.Cmd}}' "$worker_cid")"
          echo "$worker_cmd" | grep -q 'app.workers.sync_jobs_worker' || {
            echo "Worker container command does not target the sync job worker." >&2
            exit 1
          }
          frontend_cid="$(docker compose --env-file "$ENV_FILE" ps -q frontend)"
          if [ -z "$frontend_cid" ]; then
            echo "Frontend container is not running." >&2
            exit 1
          fi
          frontend_health_deadline=$((SECONDS + 120))
          frontend_health="starting"
          while [ "$SECONDS" -lt "$frontend_health_deadline" ]; do
            frontend_health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$frontend_cid")"
            if [ "$frontend_health" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          if [ "$frontend_health" != "healthy" ]; then
            echo "Frontend did not become healthy; last status was $frontend_health." >&2
            exit 1
          fi
          frontend_release="$(docker inspect -f '{{index .Config.Labels "com.fitness-pals.release-sha"}}' "$frontend_cid")"
          if [ "$frontend_release" != "$RUNTRAINER_RELEASE_SHA" ]; then
            echo "Frontend container is release $frontend_release, expected release $RUNTRAINER_RELEASE_SHA." >&2
            exit 1
          fi
          docker compose --env-file "$ENV_FILE" exec -T backend \
            python3 -c 'import sys; from urllib.request import urlopen; [urlopen(url, timeout=15).close() for url in sys.argv[1:]]' \
            "${urls[@]}"

      - name: Mint ephemeral athlete smoke token
        id: smoke-token
        run: |
          smoke_token="$(docker compose --env-file "$ENV_FILE" exec -T backend python -c 'from app.db import SESSION_FACTORY; from app.models import User; from app.utils.security import create_access_token; db = SESSION_FACTORY(); user = db.query(User).order_by(User.created_at.asc()).first(); assert user is not None, "No production athlete exists for the authenticated smoke check"; print(create_access_token(user.id)); db.close()')"
          smoke_token="${smoke_token//$'\r'/}"
          if [ -z "$smoke_token" ]; then
            echo "Failed to mint an ephemeral athlete smoke token." >&2
            exit 1
          fi
          echo "::add-mask::$smoke_token"
          echo "token=$smoke_token" >> "$GITHUB_OUTPUT"

      - name: Verify public production journey
        env:
          RUNTRAINER_SMOKE_AUTH_TOKEN: ${{ steps.smoke-token.outputs.token }}
        run: |
          CLOUDFLARE_SMOKE_TIMEOUT_SECONDS="$(python3 scripts/read_env_value.py "$ENV_FILE" CLOUDFLARE_SMOKE_TIMEOUT_SECONDS --default 180)"
          CLOUDFLARE_ROUTE_SMOKE_TIMEOUT_SECONDS="$(python3 scripts/read_env_value.py "$ENV_FILE" CLOUDFLARE_ROUTE_SMOKE_TIMEOUT_SECONDS --default 30)"
          python3 scripts/smoke_production.py \
            --expected-release "$RUNTRAINER_RELEASE_SHA" \
            --timeout "$CLOUDFLARE_SMOKE_TIMEOUT_SECONDS" \
            --route-timeout "$CLOUDFLARE_ROUTE_SMOKE_TIMEOUT_SECONDS" \
            --request-timeout 15
