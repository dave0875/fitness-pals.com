# There is support for influxdb v3 (core) OSS, but it's highly recommended to use Influxdb 1.x versions with this project. 

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    container_name: runtrainer-postgres
    environment:
      - POSTGRES_DB=${RUNTRAINER_POSTGRES_DB:-runtrainer}
      - POSTGRES_USER=${RUNTRAINER_POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${RUNTRAINER_POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  influxdb:
    restart: unless-stopped
    container_name: influxdb
    hostname: influxdb
    environment:
      - INFLUXDB_DB=${INFLUXDB_DATABASE}
      - INFLUXDB_USER=${INFLUXDB_USERNAME}
      - INFLUXDB_USER_PASSWORD=${INFLUXDB_PASSWORD}
      - INFLUXDB_DATA_INDEX_VERSION=tsi1
      #############################################################
      # The following ENV variables are applicable for InfluxDB V3
      #############################################################
      # - INFLUXDB3_MAX_HTTP_REQUEST_SIZE=10485760
      # - INFLUXDB3_NODE_IDENTIFIER_PREFIX=Influxdb-node1
      # - INFLUXDB3_BUCKET=GarminStats
      # - INFLUXDB3_OBJECT_STORE=file
      # - INFLUXDB3_DB_DIR=/data
      # - INFLUXDB3_QUERY_FILE_LIMIT=5000 # this set to be a very high value if you want to view long term data
    expose:
      - '8086' # Influxdb V3 should expose "8181" (Change INFLUXDB_PORT on garmin-fetch-data appropriately for InfluxDB V3)
    ports:
      - '8086:8086'
    volumes:
      - influxdb_data:/var/lib/influxdb # InfluxDB V3 bind mount should be set like - influxdb_data:/data if you set INFLUXDB3_DB_DIR=/data (instead of /var/lib/influxdb)
    image: 'influxdb:1.11' # You must change this to 'quay.io/influxdb/influxdb3-core:latest' for influxdb V3

  grafana:
    restart: unless-stopped
    container_name: grafana
    hostname: grafana
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_PREFERENCES_UNIT=imperial
      - GF_PREFERENCES_TIMEZONE=America/New_York
      - GF_PLUGINS_PREINSTALL=marcusolsson-hourly-heatmap-panel
      - GF_DATE_FORMATS_FULL_DATE=MMM Do, YYYY - hh:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_SECOND=hh:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_MINUTE=hh:mm a
      - GF_DATE_FORMATS_INTERVAL_HOUR=MMM DD hh:mm a
      - GF_DATE_FORMATS_INTERVAL_DAY=MMM DD
      - GF_DATE_FORMATS_INTERVAL_MONTH=YYYY-MM
      - GF_DATE_FORMATS_INTERVAL_YEAR=YYYY
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - '3000:3000'
    image: 'grafana/grafana:latest'

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    depends_on:
      grafana:
        condition: service_started
      training-agent:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  training-agent:
    build:
      context: .
      dockerfile: services/training_agent/Dockerfile
    container_name: training-agent
    restart: unless-stopped
    environment:
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_USERNAME=${INFLUXDB_USERNAME}
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD}
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE}
      - RUNTRAINER_GOOGLE_CLIENT_ID=${RUNTRAINER_GOOGLE_CLIENT_ID}
      - RUNTRAINER_GOOGLE_CLIENT_SECRET=${RUNTRAINER_GOOGLE_CLIENT_SECRET}
      - RUNTRAINER_GOOGLE_REDIRECT_URI=${RUNTRAINER_GOOGLE_REDIRECT_URI}
    ports:
      - "9000:9000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - influxdb
      - backend

  backend:
    build:
      context: ./backend
    container_name: runtrainer-backend
    environment:
      - RUNTRAINER_DATABASE_URL=postgresql://${RUNTRAINER_POSTGRES_USER:-postgres}:${RUNTRAINER_POSTGRES_PASSWORD:-postgres}@postgres:5432/${RUNTRAINER_POSTGRES_DB:-runtrainer}
      - RUNTRAINER_JWT_SECRET=${RUNTRAINER_JWT_SECRET}
      - RUNTRAINER_FERNET_KEY=${RUNTRAINER_FERNET_KEY}
      - RUNTRAINER_GOOGLE_CLIENT_ID=${RUNTRAINER_GOOGLE_CLIENT_ID}
      - RUNTRAINER_GOOGLE_CLIENT_SECRET=${RUNTRAINER_GOOGLE_CLIENT_SECRET}
      - RUNTRAINER_GOOGLE_REDIRECT_URI=${RUNTRAINER_GOOGLE_REDIRECT_URI}
      - RUNTRAINER_INFLUX_DEFAULT_URL=${RUNTRAINER_INFLUX_DEFAULT_URL}
      - RUNTRAINER_OPENAI_API_KEY=${RUNTRAINER_OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  influxdb_data:
    external: true
    name: garmin-grafana_influxdb_data
  grafana_data:
    external: true
    name: garmin-grafana_grafana_data
  postgres_data:
    external: false
