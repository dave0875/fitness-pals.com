# There is support for influxdb v3 (core) OSS, but it's highly recommended to use Influxdb 1.x versions with this project. 

services:
  runtrainer-postgres:
    image: postgres:15
    restart: unless-stopped
    container_name: runtrainer-postgres
    environment:
      - POSTGRES_DB=${RUNTRAINER_POSTGRES_DB:?RUNTRAINER_POSTGRES_DB is required}
      - POSTGRES_USER=${RUNTRAINER_POSTGRES_USER:?RUNTRAINER_POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${RUNTRAINER_POSTGRES_PASSWORD:?RUNTRAINER_POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - >
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  influxdb:
    restart: unless-stopped
    container_name: influxdb
    hostname: influxdb
    environment:
      - INFLUXDB_DB=${INFLUXDB_DATABASE:?INFLUXDB_DATABASE is required}
      - INFLUXDB_USER=${INFLUXDB_USERNAME:?INFLUXDB_USERNAME is required}
      - INFLUXDB_USER_PASSWORD=${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD is required}
      - INFLUXDB_DATA_INDEX_VERSION=tsi1
      - INFLUXDB_HTTP_FLUX_ENABLED=true
    expose:
      - '8086' 
    healthcheck:
      test:
        - CMD-SHELL
        - >
          influx -host localhost -port 8086 -username "$${INFLUXDB_USER}" -password "$${INFLUXDB_USER_PASSWORD}" -execute 'SHOW DATABASES' >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - influxdb_data:/var/lib/influxdb
    image: 'influxdb:1.11' 

  grafana:
    restart: unless-stopped
    container_name: grafana
    hostname: grafana
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      # Keep model rendering usable for read-only inspection. Deployment workflows
      # preflight both values before any service is launched.
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_OIDC_CLIENT_ID:-}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET:-}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.fitness-pals.com/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.fitness-pals.com/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.fitness-pals.com/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'Grafana Admins') && 'Admin' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=true
      - GF_AUTH_OAUTH_AUTO_LOGIN=true
      - GF_AUTH_SIGNOUT_REDIRECT_URL=https://auth.fitness-pals.com/application/o/grafana/end-session/
      - GF_SERVER_ROOT_URL=https://grafana.fitness-pals.com
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_PREFERENCES_UNIT=imperial
      - GF_PREFERENCES_TIMEZONE=America/New_York
      - GF_PLUGINS_PREINSTALL=marcusolsson-hourly-heatmap-panel
      - GF_DATE_FORMATS_FULL_DATE=MMM Do, YYYY - hh:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_SECOND=hh:mm:ss a
      - GF_DATE_FORMATS_INTERVAL_MINUTE=hh:mm a
      - GF_DATE_FORMATS_INTERVAL_HOUR=MMM DD hh:mm a
      - GF_DATE_FORMATS_INTERVAL_DAY=MMM DD
      - GF_DATE_FORMATS_INTERVAL_MONTH=YYYY-MM
      - GF_DATE_FORMATS_INTERVAL_YEAR=YYYY
    volumes:
      - grafana_data:/var/lib/grafana
    image: 'grafana/grafana:latest'

  # Added mandatory Redis cache for Authentik
  authentik-redis:
    image: redis:alpine
    container_name: authentik-redis
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.2.1}
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      - AUTHENTIK_REDIS__HOST=authentik-redis
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
      - AUTHENTIK_POSTGRESQL__HOST=runtrainer-postgres
      - AUTHENTIK_POSTGRESQL__NAME=${RUNTRAINER_POSTGRES_DB:?RUNTRAINER_POSTGRES_DB is required}
      - AUTHENTIK_POSTGRESQL__USER=${RUNTRAINER_POSTGRES_USER:?RUNTRAINER_POSTGRES_USER is required}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${RUNTRAINER_POSTGRES_PASSWORD:?RUNTRAINER_POSTGRES_PASSWORD is required}
    depends_on:
      runtrainer-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    volumes:
      - authentik_data:/media
      - authentik_data:/templates

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.2.1}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      - AUTHENTIK_REDIS__HOST=authentik-redis
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY is required}
      - AUTHENTIK_POSTGRESQL__HOST=runtrainer-postgres
      - AUTHENTIK_POSTGRESQL__NAME=${RUNTRAINER_POSTGRES_DB:?RUNTRAINER_POSTGRES_DB is required}
      - AUTHENTIK_POSTGRESQL__USER=${RUNTRAINER_POSTGRES_USER:?RUNTRAINER_POSTGRES_USER is required}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${RUNTRAINER_POSTGRES_PASSWORD:?RUNTRAINER_POSTGRES_PASSWORD is required}
      - AUTHENTIK_BOOTSTRAP_EMAIL=${AUTHENTIK_BOOTSTRAP_EMAIL:?AUTHENTIK_BOOTSTRAP_EMAIL is required}
      - AUTHENTIK_BOOTSTRAP_PASSWORD=${AUTHENTIK_BOOTSTRAP_PASSWORD:?AUTHENTIK_BOOTSTRAP_PASSWORD is required}
      - AUTHENTIK_BOOTSTRAP_TOKEN=${AUTHENTIK_BOOTSTRAP_TOKEN:?AUTHENTIK_BOOTSTRAP_TOKEN is required}
    depends_on:
      runtrainer-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    volumes:
      - authentik_data:/media
      - authentik_data:/certs
      - authentik_data:/custom-templates

  authentik-bootstrap:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.2.1}
    profiles:
      - bootstrap
    entrypoint:
      - python
    command:
      - /bootstrap/bootstrap_authentik.py
      - --google-only
      - --grafana-sso
    environment:
      - AUTHENTIK_API_URL=http://authentik-server:9000/api/v3
      - AUTHENTIK_BOOTSTRAP_TOKEN=${AUTHENTIK_BOOTSTRAP_TOKEN:?AUTHENTIK_BOOTSTRAP_TOKEN is required}
      - AUTHENTIK_GOOGLE_CLIENT_ID=${AUTHENTIK_GOOGLE_CLIENT_ID:-}
      - AUTHENTIK_GOOGLE_CLIENT_SECRET=${AUTHENTIK_GOOGLE_CLIENT_SECRET:-}
      - AUTHENTIK_GOOGLE_SOURCE_NAME=${AUTHENTIK_GOOGLE_SOURCE_NAME:-Google}
      - AUTHENTIK_GOOGLE_SOURCE_SLUG=${AUTHENTIK_GOOGLE_SOURCE_SLUG:-google}
      - AUTHENTIK_GOOGLE_AUTHENTICATION_FLOW_SLUG=${AUTHENTIK_GOOGLE_AUTHENTICATION_FLOW_SLUG:-default-source-authentication}
      - AUTHENTIK_GOOGLE_ENROLLMENT_FLOW_SLUG=${AUTHENTIK_GOOGLE_ENROLLMENT_FLOW_SLUG:-default-source-enrollment}
      - AUTHENTIK_LOGIN_FLOW_SLUG=${AUTHENTIK_LOGIN_FLOW_SLUG:-default-authentication-flow}
      - RUNTRAINER_WEB_OIDC_ISSUER=${RUNTRAINER_WEB_OIDC_ISSUER:-}
      - GRAFANA_OIDC_CLIENT_ID=${GRAFANA_OIDC_CLIENT_ID:-}
      - GRAFANA_OIDC_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET:-}
      - GRAFANA_ROOT_URL=https://grafana.fitness-pals.com
    depends_on:
      authentik-server:
        condition: service_healthy
    volumes:
      - ./scripts/bootstrap_authentik.py:/bootstrap/bootstrap_authentik.py:ro

  network-preflight:
    image: alpine@sha256:25109184c71bdad752c8312a8623239686a9a2071e8825f20acb8f2198c3f659
    profiles:
      - diagnostics
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    command:
      - /bin/sh
      - -ec
      - |
        getent hosts runtrainer-postgres >/dev/null || {
          echo "Network preflight failed: database DNS lookup." >&2
          exit 1
        }
        nc -zvw5 runtrainer-postgres 5432 || {
          echo "Network preflight failed: database peer connection." >&2
          exit 1
        }
        nc -zvw5 influxdb 8086 || {
          echo "Network preflight failed: metrics peer connection." >&2
          exit 1
        }
        nc -zvw5 authentik-server 9000 || {
          echo "Network preflight failed: identity peer connection." >&2
          exit 1
        }
        wget -q -T 10 -O /dev/null \
          https://accounts.google.com/.well-known/openid-configuration || {
          echo "Network preflight failed: outbound HTTPS." >&2
          exit 1
        }
        echo "Container peer traffic and outbound HTTPS are healthy."

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    profiles:
      - docker-tunnel
    depends_on:
      authentik-server:
        condition: service_healthy
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      grafana:
        condition: service_started
      training-agent:
        condition: service_healthy
    command: tunnel --config /etc/cloudflared/config.yml --no-autoupdate run --protocol http2 --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ./cloudflare/config.yml:/etc/cloudflared/config.yml:ro

  cloudflared-loopback:
    image: alpine/socat
    container_name: cloudflared-loopback
    restart: unless-stopped
    profiles:
      - docker-tunnel
    network_mode: "service:cloudflared"
    depends_on:
      cloudflared:
        condition: service_started
    command:
      - TCP-LISTEN:80,bind=127.0.0.1,fork,reuseaddr
      - TCP:172.19.0.1:80

  training-agent:
    build:
      context: .
      dockerfile: services/training_agent/Dockerfile
    container_name: training-agent
    restart: unless-stopped
    environment:
      - RUNTRAINER_DATABASE_URL=postgresql://${RUNTRAINER_POSTGRES_USER:?RUNTRAINER_POSTGRES_USER is required}:${RUNTRAINER_POSTGRES_PASSWORD:?RUNTRAINER_POSTGRES_PASSWORD is required}@runtrainer-postgres:5432/${RUNTRAINER_POSTGRES_DB:?RUNTRAINER_POSTGRES_DB is required}
      - RUNTRAINER_GOOGLE_CLIENT_ID=${RUNTRAINER_GOOGLE_CLIENT_ID}
      - RUNTRAINER_GOOGLE_CLIENT_SECRET=${RUNTRAINER_GOOGLE_CLIENT_SECRET}
      - RUNTRAINER_GOOGLE_REDIRECT_URI=${RUNTRAINER_GOOGLE_REDIRECT_URI}
      - RUNTRAINER_OIDC_ISSUER=${RUNTRAINER_OIDC_ISSUER}
      - RUNTRAINER_OIDC_AUTH_URL=${RUNTRAINER_OIDC_AUTH_URL}
      - RUNTRAINER_OIDC_SCOPE=${RUNTRAINER_OIDC_SCOPE:-openid email profile}
      - RUNTRAINER_OIDC_TOKEN_URL=${RUNTRAINER_OIDC_TOKEN_URL}
      - RUNTRAINER_OIDC_JWKS_URL=${RUNTRAINER_OIDC_JWKS_URL}
      - RUNTRAINER_OIDC_CLIENT_ID=${RUNTRAINER_OIDC_CLIENT_ID}
      - RUNTRAINER_OIDC_CLIENT_SECRET=${RUNTRAINER_OIDC_CLIENT_SECRET}
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import urllib.request; urllib.request.urlopen('http://localhost:9000/ready')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        RUNTRAINER_RELEASE_SHA: ${RUNTRAINER_RELEASE_SHA:-unknown}
    container_name: runtrainer-frontend
    labels:
      com.fitness-pals.release-sha: ${RUNTRAINER_RELEASE_SHA:-unknown}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: runtrainer-backend
    command:
      - /bin/sh
      - -ec
      - |
        export PYTHONPATH="$${PYTHONPATH}:/app"
        alembic upgrade head
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - RUNTRAINER_DATABASE_URL=postgresql://${RUNTRAINER_POSTGRES_USER:?RUNTRAINER_POSTGRES_USER is required}:${RUNTRAINER_POSTGRES_PASSWORD:?RUNTRAINER_POSTGRES_PASSWORD is required}@runtrainer-postgres:5432/${RUNTRAINER_POSTGRES_DB:?RUNTRAINER_POSTGRES_DB is required}
      - RUNTRAINER_JWT_SECRET=${RUNTRAINER_JWT_SECRET:?RUNTRAINER_JWT_SECRET is required}
      - RUNTRAINER_JWT_ISSUER=${RUNTRAINER_JWT_ISSUER:-https://fitness-pals.com}
      - RUNTRAINER_JWT_ACCESS_AUDIENCE=${RUNTRAINER_JWT_ACCESS_AUDIENCE:-fitness-pals-api}
      - RUNTRAINER_JWT_REFRESH_AUDIENCE=${RUNTRAINER_JWT_REFRESH_AUDIENCE:-fitness-pals-refresh}
      - RUNTRAINER_FERNET_KEY=${RUNTRAINER_FERNET_KEY:?RUNTRAINER_FERNET_KEY is required}
      - RUNTRAINER_GOOGLE_FALLBACK_ENABLED=${RUNTRAINER_GOOGLE_FALLBACK_ENABLED:-false}
      - RUNTRAINER_GOOGLE_CLIENT_ID=${RUNTRAINER_GOOGLE_CLIENT_ID:-}
      - RUNTRAINER_GOOGLE_CLIENT_SECRET=${RUNTRAINER_GOOGLE_CLIENT_SECRET:-}
      - RUNTRAINER_GOOGLE_REDIRECT_URI=${RUNTRAINER_GOOGLE_REDIRECT_URI:-}
      - RUNTRAINER_WEB_OIDC_ISSUER=${RUNTRAINER_WEB_OIDC_ISSUER}
      - RUNTRAINER_WEB_OIDC_CLIENT_ID=${RUNTRAINER_WEB_OIDC_CLIENT_ID}
      - RUNTRAINER_WEB_OIDC_CLIENT_SECRET=${RUNTRAINER_WEB_OIDC_CLIENT_SECRET}
      - RUNTRAINER_WEB_OIDC_REDIRECT_URI=${RUNTRAINER_WEB_OIDC_REDIRECT_URI}
      - RUNTRAINER_WEB_OIDC_SCOPE=${RUNTRAINER_WEB_OIDC_SCOPE:-openid email profile}
      - RUNTRAINER_INFLUX_URL=${RUNTRAINER_INFLUX_URL:-${RUNTRAINER_INFLUX_DEFAULT_URL:-http://influxdb:8086}}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-default}
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE:?INFLUXDB_DATABASE is required}
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD is required}
      - RUNTRAINER_OPENAI_API_KEY=${RUNTRAINER_OPENAI_API_KEY}
      - RUNTRAINER_ARCHIVE_IMPORT_STORAGE_BACKEND=${RUNTRAINER_ARCHIVE_IMPORT_STORAGE_BACKEND:-filesystem}
      - RUNTRAINER_ARCHIVE_IMPORT_UPLOAD_URL_TTL_SECONDS=${RUNTRAINER_ARCHIVE_IMPORT_UPLOAD_URL_TTL_SECONDS:-3600}
      - RUNTRAINER_ARCHIVE_IMPORT_FILESYSTEM_ROOT=${RUNTRAINER_ARCHIVE_IMPORT_FILESYSTEM_ROOT:-/tmp/runtrainer-archive-imports}
      - RUNTRAINER_ARCHIVE_IMPORT_GCS_BUCKET=${RUNTRAINER_ARCHIVE_IMPORT_GCS_BUCKET:-}
      - RUNTRAINER_ARCHIVE_IMPORT_GCS_CREDENTIALS_JSON=${RUNTRAINER_ARCHIVE_IMPORT_GCS_CREDENTIALS_JSON:-}
      - RUNTRAINER_ARCHIVE_IMPORT_GCS_CREDENTIALS_FILE=${RUNTRAINER_ARCHIVE_IMPORT_GCS_CREDENTIALS_FILE:-}
      - RUNTRAINER_GOOGLE_DRIVE_ARCHIVE_SOURCES_JSON=${RUNTRAINER_GOOGLE_DRIVE_ARCHIVE_SOURCES_JSON:-{}}
      - RUNTRAINER_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON=${RUNTRAINER_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:-}
      - RUNTRAINER_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE=${RUNTRAINER_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE:-}
      - GARMIN_MODE=${GARMIN_MODE}
      - GARMIN_FIT_FILE=${GARMIN_FIT_FILE:-0}
    volumes:
      - archive_import_data:/tmp/runtrainer-archive-imports
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python3 -c "import sys, urllib.request; resp = urllib.request.urlopen('http://localhost:8000/ready'); sys.exit(0) if resp.getcode() == 200 else sys.exit(1)"
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    depends_on:
      runtrainer-postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    container_name: runtrainer-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.sync_jobs_worker"]
    environment:
      - RUNTRAINER_DATABASE_URL=postgresql://${RUNTRAINER_POSTGRES_USER:?RUNTRAINER_POSTGRES_USER is required}:${RUNTRAINER_POSTGRES_PASSWORD:?RUNTRAINER_POSTGRES_PASSWORD is required}@runtrainer-postgres:5432/${RUNTRAINER_POSTGRES_DB:?RUNTRAINER_POSTGRES_DB is required}
      - RUNTRAINER_JWT_SECRET=${RUNTRAINER_JWT_SECRET:?RUNTRAINER_JWT_SECRET is required}
      - RUNTRAINER_JWT_ISSUER=${RUNTRAINER_JWT_ISSUER:-https://fitness-pals.com}
      - RUNTRAINER_JWT_ACCESS_AUDIENCE=${RUNTRAINER_JWT_ACCESS_AUDIENCE:-fitness-pals-api}
      - RUNTRAINER_JWT_REFRESH_AUDIENCE=${RUNTRAINER_JWT_REFRESH_AUDIENCE:-fitness-pals-refresh}
      - RUNTRAINER_FERNET_KEY=${RUNTRAINER_FERNET_KEY:?RUNTRAINER_FERNET_KEY is required}
      - RUNTRAINER_INFLUX_URL=${RUNTRAINER_INFLUX_URL:-${RUNTRAINER_INFLUX_DEFAULT_URL:-http://influxdb:8086}}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-default}
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE:?INFLUXDB_DATABASE is required}
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD:?INFLUXDB_PASSWORD is required}
      - RUNTRAINER_OPENAI_API_KEY=${RUNTRAINER_OPENAI_API_KEY}
      - RUNTRAINER_ARCHIVE_IMPORT_STORAGE_BACKEND=${RUNTRAINER_ARCHIVE_IMPORT_STORAGE_BACKEND:-filesystem}
      - RUNTRAINER_ARCHIVE_IMPORT_UPLOAD_URL_TTL_SECONDS=${RUNTRAINER_ARCHIVE_IMPORT_UPLOAD_URL_TTL_SECONDS:-3600}
      - RUNTRAINER_ARCHIVE_IMPORT_FILESYSTEM_ROOT=${RUNTRAINER_ARCHIVE_IMPORT_FILESYSTEM_ROOT:-/tmp/runtrainer-archive-imports}
      - RUNTRAINER_ARCHIVE_IMPORT_GCS_BUCKET=${RUNTRAINER_ARCHIVE_IMPORT_GCS_BUCKET:-}
      - RUNTRAINER_ARCHIVE_IMPORT_GCS_CREDENTIALS_JSON=${RUNTRAINER_ARCHIVE_IMPORT_GCS_CREDENTIALS_JSON:-}
      - RUNTRAINER_ARCHIVE_IMPORT_GCS_CREDENTIALS_FILE=${RUNTRAINER_ARCHIVE_IMPORT_GCS_CREDENTIALS_FILE:-}
      - RUNTRAINER_GOOGLE_DRIVE_ARCHIVE_SOURCES_JSON=${RUNTRAINER_GOOGLE_DRIVE_ARCHIVE_SOURCES_JSON:-{}}
      - RUNTRAINER_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON=${RUNTRAINER_GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:-}
      - RUNTRAINER_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE=${RUNTRAINER_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE:-}
      - GARMIN_MODE=${GARMIN_MODE}
      - GARMIN_FIT_FILE=${GARMIN_FIT_FILE:-0}
      - SYNC_WORKER_POLL_INTERVAL_SECONDS=${SYNC_WORKER_POLL_INTERVAL_SECONDS:-5}
    volumes:
      - archive_import_data:/tmp/runtrainer-archive-imports
    depends_on:
      backend:
        condition: service_healthy
      influxdb:
        condition: service_healthy

volumes:
  archive_import_data:
  influxdb_data:
    external: true
    name: garmin-grafana_influxdb_data
  grafana_data:
    external: true
    name: garmin-grafana_grafana_data
  authentik_data:
  postgres_data:
    external: true
    name: ${RUNTRAINER_POSTGRES_VOLUME_NAME:-fitness-palscom_postgres_data}
  redis_data:
